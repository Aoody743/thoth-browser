<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Welcome to Thoth</title>
        <link rel="icon" type="image/svg+xml" href="resource://icons/thoth-mark-light.svg" media="(prefers-color-scheme: light)" />
        <link rel="icon" type="image/svg+xml" href="resource://icons/thoth-mark-dark.svg" media="(prefers-color-scheme: dark)" />
        <link rel="stylesheet" href="resource://ladybird/ladybird.css" />
        <link rel="stylesheet" href="resource://ladybird/about-pages/webui.css" />
        <link rel="stylesheet" href="resource://ladybird/about-pages/welcome.css" />
        <script type="module" src="resource://ladybird/about-pages/interface-language.js"></script>
        <script type="module" src="resource://ladybird/about-pages/welcome.js"></script>
    </head>
    <body>
        <main class="welcome-frame">
            <section id="welcome-intro" class="welcome-intro" aria-labelledby="welcome-title">
                <div class="intro-mark">
                    <picture>
                        <source type="image/svg+xml" srcset="resource://icons/thoth-mark-dark.svg" media="(prefers-color-scheme: dark)" />
                        <img src="resource://icons/thoth-mark-light.svg" alt="" />
                    </picture>
                </div>
                <p class="eyebrow intro-eyebrow">A new place to wander</p>
                <h1 id="welcome-title">Thoth Browser</h1>
                <p class="intro-description">A calmer way to browse.</p>
                <button id="begin-setup" class="primary-button" type="button" disabled>
                    Get started <span aria-hidden="true">↗</span>
                </button>
                <p class="intro-footnote">You can change these choices later.</p>
            </section>

            <form id="welcome-form" hidden>
                <div class="step-heading">
                    <div>
                        <p class="eyebrow">Make it yours</p>
                        <p id="step-count" class="step-count">01 <span>/ 03</span></p>
                    </div>
                    <div id="step-progress" class="step-progress" role="progressbar" aria-label="Setup progress" aria-valuemin="1" aria-valuemax="3" aria-valuenow="1">
                        <span class="progress-segment"></span>
                        <span class="progress-segment"></span>
                        <span class="progress-segment"></span>
                    </div>
                </div>

                <fieldset id="setup-options" disabled>
                    <section class="setup-step" data-step="0" aria-labelledby="language-title" hidden>
                        <h2 id="language-title" tabindex="-1">Language</h2>
                        <p class="step-description">Choose English or 简体中文.</p>
                        <div class="language-choices" role="radiogroup" aria-labelledby="language-title">
                            <label class="language-choice">
                                <input type="radio" name="interface-language" value="en" checked />
                                <span class="language-glyph" aria-hidden="true">Aa</span>
                                <span class="language-copy"><strong>English</strong></span>
                                <span class="choice-mark" aria-hidden="true"></span>
                            </label>
                            <label class="language-choice">
                                <input type="radio" name="interface-language" value="zh-CN" />
                                <span class="language-glyph language-glyph-chinese" aria-hidden="true">文</span>
                                <span class="language-copy"><strong>简体中文</strong></span>
                                <span class="choice-mark" aria-hidden="true"></span>
                            </label>
                        </div>
                    </section>

                    <section class="setup-step" data-step="1" aria-labelledby="search-title" hidden>
                        <h2 id="search-title" tabindex="-1">Search</h2>
                        <p class="step-description">Choose the engine for address bar searches.</p>
                        <div class="control-panel search-panel">
                            <label for="search-engine">Search engine</label>
                            <select id="search-engine">
                                <option value="">Disable search</option>
                            </select>
                            <div class="option-divider"></div>
                            <label class="switch-option">
                                <input id="search-suggestions-enabled" type="checkbox" switch aria-describedby="search-suggestions-description" />
                                <span><strong>Search suggestions</strong><small id="search-suggestions-description">Choose a search engine to use search suggestions.</small></span>
                            </label>
                        </div>
                    </section>

                    <section class="setup-step" data-step="2" aria-labelledby="privacy-title" hidden>
                        <h2 id="privacy-title" tabindex="-1">Privacy</h2>
                        <p class="step-description">Choose whether to block common ads and trackers.</p>
                        <div class="control-panel privacy-panel">
                            <label class="switch-option privacy-switch">
                                <input id="enable-content-blocking" type="checkbox" switch />
                                <span><strong>Block ads and trackers</strong><small>Keep pages calmer and reduce common tracking.</small></span>
                            </label>
                            <div id="blocking-options" class="blocking-options">
                                <details>
                                    <summary>Choose filter lists</summary>
                                    <div id="content-blocker-lists"></div>
                                </details>
                            </div>
                        </div>
                    </section>
                </fieldset>

                <footer class="step-footer">
                    <button id="previous-step" class="text-button" type="button">Back</button>
                    <div class="footer-spacer"></div>
                    <button id="continue-step" class="primary-button" type="button" disabled>Continue <span aria-hidden="true">→</span></button>
                    <button id="start-browsing" class="primary-button" type="submit" disabled hidden>Start browsing <span aria-hidden="true">↗</span></button>
                </footer>
                <p id="save-status" role="status"></p>
            </form>
        </main>
    </body>
</html>
