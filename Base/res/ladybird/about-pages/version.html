<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="color-scheme" content="light dark" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>About Thoth Browser</title>
        <link rel="icon" type="image/svg+xml" href="resource://icons/thoth-mark-light.svg" media="(prefers-color-scheme: light)" />
        <link rel="icon" type="image/svg+xml" href="resource://icons/thoth-mark-dark.svg" media="(prefers-color-scheme: dark)" />
        <link rel="stylesheet" href="resource://ladybird/about-pages/about.css" />
        <link rel="stylesheet" href="resource://ladybird/about-pages/version.css" />
        <script type="module" src="resource://ladybird/about-pages/interface-language.js"></script>
    </head>
    <body>
        <main class="version-page">
            <div class="about-brand">
                <div class="about-mark">
                    <picture>
                        <source type="image/svg+xml" srcset="resource://icons/thoth-mark-dark.svg" media="(prefers-color-scheme: dark)" />
                        <img src="resource://icons/thoth-mark-light.svg" alt="" />
                    </picture>
                </div>
                <div class="about-copy">
                    <p class="about-eyebrow">About Thoth</p>
                    <h1 id="browser-name">Thoth Browser</h1>
                    <p class="about-subtitle"><span>Version</span> <strong id="browser-version"></strong></p>
                </div>
            </div>

            <div class="about-rule"></div>

            <section class="version-group" aria-labelledby="build-heading">
                <div class="version-heading">
                    <span class="feature-number">01</span>
                    <h2 id="build-heading">Build details</h2>
                </div>
                <dl class="version-list">
                    <div class="version-row">
                        <dt>Commit</dt>
                        <dd id="browser-commit"></dd>
                    </div>
                    <div class="version-row">
                        <dt>Architecture</dt>
                        <dd id="arch"></dd>
                    </div>
                    <div class="version-row">
                        <dt>Operating system</dt>
                        <dd id="platform-name"></dd>
                    </div>
                    <div class="version-row">
                        <dt>User agent</dt>
                        <dd id="user-agent"></dd>
                    </div>
                </dl>
            </section>

            <section class="version-group" aria-labelledby="runtime-heading">
                <div class="version-heading">
                    <span class="feature-number">02</span>
                    <h2 id="runtime-heading">Runtime</h2>
                </div>
                <dl class="version-list">
                    <div class="version-row">
                        <dt>Command line</dt>
                        <dd id="command-line"></dd>
                    </div>
                    <div class="version-row">
                        <dt>Application path</dt>
                        <dd id="executable-path"></dd>
                    </div>
                </dl>
            </section>
        </main>

        <script type="module">
            const browserName = document.querySelector("#browser-name");
            const browserVersion = document.querySelector("#browser-version");
            const browserCommit = document.querySelector("#browser-commit");
            const arch = document.querySelector("#arch");
            const platformName = document.querySelector("#platform-name");
            const userAgent = document.querySelector("#user-agent");
            const commandLine = document.querySelector("#command-line");
            const executablePath = document.querySelector("#executable-path");

            function renderVersionInfo(versionInfo) {
                const name = versionInfo?.browserName || "Thoth Browser";
                browserName.innerText = name;
                browserVersion.innerText = versionInfo?.browserVersion || "—";
                browserCommit.innerText = versionInfo?.browserCommit || "—";
                arch.innerText = versionInfo?.arch || "—";
                platformName.innerText = versionInfo?.platformName || "—";
                userAgent.innerText = navigator.userAgent;
                commandLine.innerText = versionInfo?.commandLine || "—";
                executablePath.innerText = versionInfo?.executablePath || "—";
            }

            document.addEventListener("WebUILoaded", () => {
                ladybird.sendMessage("loadVersionInfo");
            });

            document.addEventListener("WebUIMessage", event => {
                if (event.detail.name === "renderVersionInfo") {
                    renderVersionInfo(event.detail.data);
                }
            });
        </script>
    </body>
</html>
